name: Redmi Rescue APK (beta)
on:
  push:
    branches: [redmi-rescue-beta]
    paths:
      - 'redmi-rescue/**'
      - '.github/workflows/redmi-rescue-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK
        run: gradle -p redmi-rescue :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redmi-rescue-beta-apk
          path: redmi-rescue/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
